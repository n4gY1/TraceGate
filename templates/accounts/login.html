{% load static %}
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tracker Intelligence — Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-page">

    <!-- Cyber háttér -->
    <div class="cyber-grid"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <!-- Dekoratív vonalak -->
    <div class="scan-line"></div>


    <!-- LOGIN CONTAINER -->
    <main class="login-container">

        <!-- BRAND -->

        <div class="login-brand">

            <div class="brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <div class="brand-name">
                <span>TRACKER</span>
                <small>INTELLIGENCE SYSTEM</small>
            </div>

        </div>

        <div class="login-card">
            <div class="card-top-line"></div>
            <div class="login-header">
                <div class="status">
                    <span class="status-dot"></span>
                    SECURE AUTHENTICATION
                </div>
                <h1>Welcome back</h1>
                <p>
                    Authenticate to access the investigation platform.
                </p>
            </div>
            <form method="POST" action="" class="login-form">
                {% csrf_token %}
                <div class="form-field">
                    <label for="username">
                        USERNAME
                    </label>
                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">
                        PASSWORD
                    </label>
                    <div class="input-wrapper">
                        <i class="bi bi-key"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">

                    <i class="bi bi-shield-check"></i>

                    <span>AUTHENTICATE</span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>
            <div class="security-status">
                <div class="security-status-icon">
                    <i class="bi bi-shield-fill-check"></i>
                </div>
                <div>
                    <strong>SECURE CONNECTION</strong>

                    <span>
                        Encrypted authentication channel
                    </span>
                </div>

                <div class="connection-indicator">
                    <span></span>
                    ONLINE
                </div>
            </div>
        </div>

        <div class="login-footer">
            <span>
                <i class="bi bi-cpu"></i>
                TRACKER INTELLIGENCE SYSTEM
            </span>
            <span class="separator">•</span>
            <span>
                AUTHORIZED ACCESS ONLY
            </span>
        </div>
    </main>
</div>
<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const icon =
        document.querySelector(".password-toggle i");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }
}
</script>
</body>
</html>
