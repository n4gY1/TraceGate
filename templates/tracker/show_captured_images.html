{% extends 'main/base.html' %}

{% block content %}
{% include 'main/navbar.html' %}

<div class="row mt-5">
    {% for picture in pictures %}
        <div class="col col-4">
            <a href="{{picture.photo.url}}" target="_blank">
                <img src="{{picture.photo.url}}" class="img-thumbnail" style="width:200px;height:200px;object-fit:cover">
            </a>
        </div>
    {% endfor %}

</div>



{% endblock content %}
